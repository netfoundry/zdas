# ZDAS configuration
listen: ":18443"                          # address to bind
external_url: "https://das.example.com"   # how tunnelers and the controller reach ZDAS

# Optional: delegate the IdP selector page to the embedding application.
# When set and 2+ providers are registered, ZDAS 302-redirects
# /authorize requests without an idp to this URL with the original query
# string plus `providers=<comma-separated names>` and `consent=<opaque>`.
# The host app renders its own picker page, on the same site as ZDAS,
# that POSTs `consent` and `idp=<chosen-name>` back to /authorize when the
# user clicks. See Config.IDPSelectorURL for the requirements.
# When unset, ZDAS renders a built-in picker.
# idp_selector_url: "https://app.example.com/enroll/pick-idp"

# Each IdP sends the browser back to <external_url>/callback/<provider name>;
# register that redirect URI with each IdP's client. Deprecated: set this to
# keep using the old shared <external_url>/callback until the registrations
# are updated. It will be removed.
# legacy_callback: true

# TLS - three modes:
#   "none"   - plain HTTP (development, or behind a TLS-terminating reverse proxy)
#   "static" - provide your own cert and key files
#   "acme"   - automatic certs via Let's Encrypt
tls:
  mode: "none"
  # static mode
  # cert_file: "/path/to/cert.pem"
  # key_file: "/path/to/key.pem"
  # acme mode
  # acme:
  #   domains:
  #     - "das.example.com"
  #   cache_dir: "/var/lib/zdas/certs"

# Ziti controller - ZDAS discovers upstream IdPs and manages identities here
controller:
  api_url: "https://controller.example.com:1280"
  # OpenZiti identity JSON file (cert, key and CA) for the management API,
  # needed for fallback reconciliation. It needs only two permissions, not
  # admin:
  #   ziti edge create identity zdas-reconciler \
  #     --permissions identity.read,identity.update -o zdas-reconciler.jwt
  #   ziti edge enroll zdas-reconciler.jwt -o zdas-reconciler.json
  # identity.update still lets it change every field of any identity that
  # isn't an admin, except its permissions: its name, role attributes,
  # external ID and auth policy among them. A changed external ID lets
  # whoever holds that ID sign in as the identity, so whoever holds this file
  # can take over any non-admin identity. Guard it as you would an identity
  # admin's. ZDAS warns at startup if the identity is a full admin.
  # identity_file: "/path/to/zdas-reconciler.json"
  # PEM CA bundle for controllers using a private CA (when no identity file).
  # Not needed when the controller has a publicly-trusted cert.
  # ca_bundle: "/path/to/controller-ca.pem"
  poll_interval: "5m"                          # how often to re-read signers from the controller

# Fallback for unmodified tunnelers that don't send device_name.
# When enabled, ZDAS allows enrollment without device info and reconciles
# the identity name after the tunneler connects and reports envInfo.
fallback:
  enabled: false                              # set true to allow enrollment without device_name
  poll_interval: "10s"                        # how often to check for envInfo on pending identities
  temp_name_template: "{username}-pending-{nonce_short}"
  timeout: "1h"                               # stop tracking after this long

# Directly-configured upstream providers (optional). Most OIDC providers are
# discovered from the controller automatically; use this section for providers
# that aren't registered as ext-jwt-signers (e.g., GitHub) or for embedding
# scenarios where the controller doesn't know about them.
# A discovered provider admits every user its issuer signs in. To restrict
# one, configure a provider here with the signer's name, issuer and client
# ID, and a policy; ZDAS then uses it in place of the discovered one. Its
# scopes replace the defaults, so list openid, profile and email plus any the
# signer adds or the policy needs.
# providers:
#   - type: "github"
#     name: "github"
#     client_id: "Iv1.abc123"
#     client_secret: "secret"          # or use ZDAS_PROVIDER_GITHUB_CLIENT_SECRET env var
#     username_field: "login"          # "login" | "name" | "email"
#     user_id_field: "id"
#     allowed_orgs:                    # only members of these orgs may enroll
#       - "mycompany"
#   - type: "oidc"
#     name: "google"
#     client_id: "abc.apps.googleusercontent.com"
#     client_secret: "GOCSPX-..."       # required for Google "Web application" clients; optional for other OIDC IdPs
#     oidc_issuer_url: "https://accounts.google.com"
#     allowed_email_domains:           # only users with a verified address in these domains
#       - "mycompany.com"
#     # required_claims:               # each claim must have one of the values (any element, for a list)
#     #   groups: ["ziti-users"]
#     # scopes: ["openid", "profile", "email"]   # optional, this is the default
#     # fetch_userinfo: true     # merge the userinfo response into upstream claims (for IdPs that keep groups out of the ID token)
#     # require_userinfo: true   # fail the login if userinfo cannot be fetched; needs fetch_userinfo
#
# A configured provider must say who may enroll: allowed_orgs for github,
# allowed_email_domains and/or required_claims for oidc. To let anyone who
# can sign in to it enroll - for GitHub or Google, anyone at all - set
# allow_any_user: true instead. Discovered signers are the controller
# admin's choice and need neither.

# Claim composition
# Updated tunnelers send device info as query params on /authorize:
#   device_name, hostname, os, arch, os_release, os_version
# Available template placeholders: {username}, {device_name}, {hostname}, {os}, {arch}
claims:
  username_claim: "preferred_username"
  name_template: "{username}-{device_name}"
  identity_name_claim: "device_identity_name"
  external_id_claim: "device_external_id"

# Token settings
token:
  audience: "ziti-enroll"            # must match the audience on the ext-jwt-signer
  expiry: "5m"
  # Audiences an embedding application's provisioner may give an enrollment
  # by setting its "aud" claim, one per OpenZiti network it serves, each
  # matching the audience of ZDAS's signer on that network.
  # provisioner_audiences: ["network-a", "network-b"]

# Session settings. timeout covers a whole sign-in, from the tunneler
# opening /authorize to the IdP's callback, consent page included.
session:
  timeout: "10m"
  code_expiry: "60s"

# Rate limiting on /authorize. Every GET /authorize stores a session before
# anyone signs in, and a sign-in is two requests (the page, then the user's
# click). Refused requests get 429 and are logged, with counts, at most once
# a minute.
#   - Per client, on by default: a client is the connection's peer address
#     (an IPv4 address or an IPv6 /64).
#   - Global, off by default: valid GET /authorize from all clients
#     together, per replica. A few addresses can use it up and so refuse
#     everyone, which is worse than the built-in store's answer to a flood:
#     it holds 10,000 sessions and drops the oldest, which takes about 77
#     IPv4 addresses or 5 IPv6 /48s to do within a one-minute sign-in. Set
#     it only to keep a shared store small.
# Set a rate to 0 to turn that limit off, e.g. when something in front of
# ZDAS already limits /authorize.
#
# Behind a reverse proxy, list it in trusted_proxies (IP addresses or CIDR
# prefixes) so requests count against the client address it reports in
# X-Forwarded-For. Without that, every request counts against the proxy, and
# the per-client limit becomes a limit for everyone. The same list decides
# the client ZDAS's warnings name, even with the limits off.
# X-Forwarded-For from any other peer is ignored, since clients can set it.
rate_limit:
  authorize_per_second: 2
  authorize_burst: 10
  # global_per_second: 5
  # global_burst: 500
  # trusted_proxies: ["10.0.0.0/8"]

# Where /authorize may send the browser back with a code. Unset (the
# default) accepts only loopback callbacks - http(s) to localhost or a
# loopback IP, any port - which is all tunnelers use. When set, it replaces
# that default. An entry for a host other than loopback needs the full
# callback path and matches only exactly (scheme, host, port and path). A
# loopback entry without a port matches any port, and without a path any
# path.
# allowed_redirect_uris:
#   - "http://localhost"
#   - "https://app.example.com/enroll/callback"
