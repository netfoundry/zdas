name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Build with the latest patched toolchain, not the go.mod minimum, so
      # binaries carry current standard library security fixes.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          check-latest: true

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build binaries
        run: |
          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X main.version=${version}"

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          mkdir -p dist
          for platform in "${platforms[@]}"; do
            os="${platform%%/*}"
            arch="${platform##*/}"
            output="zdas-${version}-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${os}/${arch}..."
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "dist/${output}" ./cmd/zdas/
          done

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums-sha256.txt

      # Lets anyone check a binary was built by this workflow from this
      # repository: gh attestation verify <file> --repo smilindave26/zdas
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/zdas-*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
